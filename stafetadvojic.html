<style>

}

body{

/* PREPINAC */

}

.category-button{

}

    background:#b92828;
    border-color:#ef3333;

/* DRUZSTVO */

.team-card{
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.10);
    border-radius:20px;
    padding:18px;
    margin-bottom:14px;
}

.team-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.team-name{
    font-size:21px;
    font-weight:bold;
}

.team-start{
    color:#8995a6;
    font-size:13px;
}

.relay{
    border:1px solid rgba(255,255,255,.08);
    background:rgba(0,0,0,.16);
    border-radius:15px;

}

.relay-title{

}

    grid-template-columns:1fr 1fr;

.measure-label{

}

.measure-value{

}

.relay-result{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid rgba(255,255,255,.08);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.result-label{
    color:#8995a6;
}

.result-value{
    color:#ffd166;
    font-size:21px;
    font-weight:bold;
}

.total{
    margin-top:14px;
    padding:14px;
    border-radius:13px;
    background:#252e3c;

    justify-content:space-between;
    align-items:center;
}

.total-label{
    font-weight:bold;
}

.total-value{
    color:#ffd166;
    font-size:23px;
    font-weight:bold;
}

.team-actions{
    margin-top:14px;
    text-align:right;
}

.action{
    border:0;
    background:transparent;
    color:#aeb9c8;
    cursor:pointer;
    font-size:18px;
    margin-left:5px;
}

.move{
    border:0;
    background:#252e3c;
    color:white;
    border-radius:7px;
    cursor:pointer;
    padding:6px 9px;
    margin-left:3px;
}

.place{
    font-size:18px;
    font-weight:bold;
    color:#dbe2eb;
}

.gold{
    color:#ffd700;
}

.silver{
    color:#cfd3d8;
}

.bronze{
    color:#cd7f32;
}

.empty{
    text-align:center;
    padding:30px;
    color:#718096;
}

.status{
    text-align:center;
    color:#68778b;
    font-size:12px;
    margin-top:20px;
}

.online{
    display:inline-block;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#36d399;

@media(max-width:650px){

    .form{
        grid-template-columns:1fr;
    }

<body>

<div class="app">


<button
class="back"
onclick="window.location.href='index.html'">

← Zpět

</button>


<header class="header">

<div class="logo">
🏃‍♂️
</div>

<h1>

<span>SBOR DOBROVOLNÝCH HASIČŮ</span><br>

LUBINA II–VĚTŘKOVICE

</h1>

<div class="district">

okres Nový Jičín · Štafeta dvojic

</div>

</header>


<!-- PŘIDÁNÍ -->

<div class="card">

<h2>
➕ Přidat družstvo
</h2>

<div class="form">

<input
id="druzstvo"
placeholder="Název družstva">

<select
id="kategorie">

<option value="mladsi">
👦 Mladší
</option>

<option value="starsi">
🧑 Starší
</option>

</select>

<button
class="primary"
onclick="pridatDruzstvo()">

+ Přidat

</button>

</div>

</div>


<!-- IMPORT -->

<div class="card">

<h2>
📥 Import z Excelu
</h2>

<div class="excel-info">

Excel musí obsahovat sloupce:

<b>Družstvo</b> a <b>Kategorie</b>.

<br><br>

Kategorie může být:

<b>Mladší</b> nebo <b>Starší</b>.

</div>


<div class="excel-example">

<div class="example-title">
📋 Ukázka Excelu
</div>

<table class="example-table">

<thead>

<tr>
<th>Družstvo</th>
<th>Kategorie</th>
</tr>

</thead>

<tbody>

<tr>
<td>Lubina A</td>
<td>Mladší</td>
</tr>

</tbody>

</table>

</div>

<div class="import-box">

type="file"
id="excelFile"
accept=".xlsx,.xls">

📥 Načíst Excel

<!-- VYSLEDKY -->

<div class="card">

<h2>
🏆 Výsledky
</h2>


<div class="category-buttons">

<button
id="btnMladsi"
class="category-button active"
onclick="vyberKategorii('mladsi')">

👦 Mladší

</button>

<button
id="btnStarsi"
class="category-button"
onclick="vyberKategorii('starsi')">

🧑 Starší

</button>

</div>


<div id="vysledky"></div>

</div>


<div class="status">

<span class="online"></span>

Živá aktualizace

</div>


</div>


<script type="module">


import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
getFirestore,
collection,
addDoc,
onSnapshot,
deleteDoc,
doc,
updateDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyDHGLymt1Ram6s0LJSeQLmf-hZJvCM-9jo",

authDomain:
"deti-hra-plamen-lubina.firebaseapp.com",

projectId:
"deti-hra-plamen-lubina",

storageBucket:
"deti-hra-plamen-lubina.firebasestorage.app",

messagingSenderId:
"511766112817",

appId:
"1:511766112817:web:3e9a11e9c10f234c7ac310"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);

const col=
collection(
db,
"stafety_dvojic"
);


let data=[];

let vybranaKategorie="mladsi";


/* ČAS */

function validTime(t){

if(!t)
return false;

if(!t.includes(":"))
return false;

const casti=t.split(":");

if(casti.length!==2)
return false;

const sekundy=Number(casti[0]);
const setiny=Number(casti[1]);

if(
isNaN(sekundy)||
isNaN(setiny)
)
return false;

if(sekundy<0)
return false;

if(setiny<0||setiny>99)
return false;

return true;

}


function casNaCislo(cas){

const casti=cas.split(":");

return Number(casti[0])*100+
Number(casti[1]);

}


function cisloNaCas(cislo){

const sekundy=
Math.floor(cislo/100);

const setiny=
cislo%100;

return sekundy+
":"+
String(setiny).padStart(2,"0");

}


/*
VÝSLEDEK JEDNÉ ŠTAFETY

BEREME HORŠÍ
ZE DVOU MĚŘENÍ
*/

function vysledekStafety(
m1,
m2
){

const a=
validTime(m1)
?
casNaCislo(m1)
:
null;

const b=
validTime(m2)
?
casNaCislo(m2)
:
null;


if(a===null&&b===null)
return null;

if(a===null)
return b;

if(b===null)
return a;


/* HORŠÍ ČAS */

return Math.max(a,b);

}


/*
CELKOVÝ VÝSLEDEK

Z OBOU ŠTAFET
BEREME LEPŠÍ
*/

function celkovyVysledek(z){

const s1=
vysledekStafety(
z.s1m1,
z.s1m2
);

const s2=
vysledekStafety(
z.s2m1,
z.s2m2
);


if(s1===null&&s2===null)
return null;

if(s1===null)
return s2;

if(s2===null)
return s1;


return Math.min(s1,s2);

}


/* REALTIME */

onSnapshot(

col,

(snap)=>{

data=[];

snap.forEach(
d=>{

data.push({

id:d.id,
...d.data()

});

});

render();

},

(error)=>{

console.error(error);

alert(
"Chyba při načítání dat z Firebase."
);

}

);


/* PŘIDAT */

window.pridatDruzstvo=
async function(){

const nazev=
document
.getElementById("druzstvo")
.value
.trim();

const kategorie=
document
.getElementById("kategorie")
.value;


if(!nazev){

alert(
"Zadej název družstva."
);

return;

}


const maxStart=
data.reduce(
(max,z)=>
Math.max(
max,
Number(z.start)||0
),
0
);


await addDoc(

col,

{

druzstvo:nazev,

kategorie:kategorie,

start:maxStart+1,

s1m1:"",
s1m2:"",

s2m1:"",
s2m2:"",

vytvoreno:
serverTimestamp()

}

);


document
.getElementById("druzstvo")
.value="";

};


/* IMPORT */

window.importExcel=
async function(){

const input=
document.getElementById(
"excelFile"
);


if(
!input.files||
!input.files.length
){

alert(
"Vyber nejdříve Excel soubor."
);

return;

}


try{

const file=input.files[0];

const buffer=
await file.arrayBuffer();

const workbook=
XLSX.read(
buffer,
{
type:"array"
}
);

const sheet=
workbook.Sheets[
workbook.SheetNames[0]
];

const rows=
XLSX.utils.sheet_to_json(
sheet,
{
defval:""
}
);


if(!rows.length){

alert(
"Excel neobsahuje žádná data."
);

return;

}


let pocet=0;

let maxStart=
data.reduce(
(max,z)=>
Math.max(
max,
Number(z.start)||0
),
0
);


for(
const row of rows
){

const druzstvo=
najdiHodnotu(
row,
[
"Družstvo",
"Druzstvo"
]
);

const kategorie=
najdiHodnotu(
row,
[
"Kategorie"
]
);


if(
!druzstvo||
!kategorie
)
continue;


const kat=
normalizujKategorii(
kategorie
);


if(!kat)
continue;


maxStart++;


await addDoc(

col,

{

druzstvo:
String(druzstvo).trim(),

kategorie:kat,

start:maxStart,

s1m1:"",
s1m2:"",

s2m1:"",
s2m2:"",

vytvoreno:
serverTimestamp(),

importExcel:true

}

);


pocet++;

}


zobrazZpravu(
"✓ Import dokončen. Přidáno družstev: "+pocet,
false
);

input.value="";

}

catch(error){

console.error(error);

zobrazZpravu(
"Excel se nepodařilo načíst.",
true
);

}

};


/* NAJÍT HODNOTU */

function najdiHodnotu(
row,
nazvy
){

for(
const klic of Object.keys(row)
){

const normal=
klic
.toString()
.trim()
.toLowerCase();


for(
const nazev of nazvy
){

if(
normal===
nazev.toLowerCase()
){

return row[klic];

}

}

}

return "";

}


/* KATEGORIE */

function normalizujKategorii(
hodnota
){

const text=
String(hodnota)
.trim()
.toLowerCase();


if(
text==="mladší"||
text==="mladsi"
)
return "mladsi";


if(
text==="starší"||
text==="starsi"
)
return "starsi";


return "";

}


/* VYBRAT KATEGORII */

window.vyberKategorii=
function(kategorie){

vybranaKategorie=kategorie;

document
.getElementById("btnMladsi")
.classList
.toggle(
"active",
kategorie==="mladsi"
);

document
.getElementById("btnStarsi")
.classList
.toggle(
"active",
kategorie==="starsi"
);

render();

};


/* ZADAT CAS */

window.ulozCas=
async function(
id,
soutez,
mereni
){

const z=
data.find(
x=>x.id===id
);

if(!z)
return;


const pole=
"s"+
soutez+
"m"+
mereni;


const hodnota=
prompt(
"Zadej čas:",
z[pole]||""
);


if(hodnota===null)
return;


if(
hodnota!==""&&
!validTime(hodnota)
){

alert(
"Špatný čas. Použij například 23:45."
);

return;

}


await updateDoc(

doc(
db,
"stafety_dvojic",
id
),

{

[pole]:hodnota

}

);

};


/* EDIT */

window.editDruzstvo=
async function(id){

const z=
data.find(
x=>x.id===id
);

if(!z)
return;


const novy=
prompt(
"Družstvo:",
z.druzstvo
);


if(
novy===null||
!novy.trim()
)
return;


await updateDoc(

doc(
db,
"stafety_dvojic",
id
),

{

druzstvo:
novy.trim()

}

);

};


/* SMAZAT */

window.smazDruzstvo=
async function(id){

if(
!confirm(
"Opravdu chceš smazat toto družstvo?"
)
)
return;


await deleteDoc(

doc(
db,
"stafety_dvojic",
id
)

);

};


/* POSUN NAHORU */

window.posunNahoru=
async function(id){

const seznam=
[...data].sort(
(a,b)=>
Number(a.start||0)-
Number(b.start||0)
);


const index=
seznam.findIndex(
x=>x.id===id
);


if(index<=0)
return;


const pred=
seznam[index-1];

const akt=
seznam[index];


await updateDoc(
doc(db,"stafety_dvojic",akt.id),
{
start:pred.start
}
);

await updateDoc(
doc(db,"stafety_dvojic",pred.id),
{
start:akt.start
}
);

};


/* POSUN DOLŮ */

window.posunDolu=
async function(id){

const seznam=
[...data].sort(
(a,b)=>
Number(a.start||0)-
Number(b.start||0)
);


const index=
seznam.findIndex(
x=>x.id===id
);


if(
index<0||
index>=seznam.length-1
)
return;


const dalsi=
seznam[index+1];

const akt=
seznam[index];


await updateDoc(
doc(db,"stafety_dvojic",akt.id),
{
start:dalsi.start
}
);

await updateDoc(
doc(db,"stafety_dvojic",dalsi.id),
{
start:akt.start
}
);

};


/* RENDER */

window.render=
function(){

const box=
document.getElementById(
"vysledky"
);

box.innerHTML="";


const seznam=
data
.filter(
z=>
z.kategorie===
vybranaKategorie
)
.sort(
(a,b)=>{

const aa=
celkovyVysledek(a);

const bb=
celkovyVysledek(b);


if(aa===null&&bb===null)
return Number(a.start)-Number(b.start);

if(aa===null)
return 1;

if(bb===null)
return -1;

return aa-bb;

}
);


if(!seznam.length){

box.innerHTML=`

<div class="empty">

Zatím není přidané žádné družstvo.

</div>

`;

return;

}


seznam.forEach(
(z,index)=>{

vykresliDruzstvo(
box,
z,
index
);

});

};


/* VYKRESLIT DRUŽSTVO */

function vykresliDruzstvo(
box,
z,
index
){

const s1=
vysledekStafety(
z.s1m1,
z.s1m2
);

const s2=
vysledekStafety(
z.s2m1,
z.s2m2
);

const celkem=
celkovyVysledek(z);


let placeClass="";

if(celkem!==null){

if(index===0)
placeClass="gold";

if(index===1)
placeClass="silver";

if(index===2)
placeClass="bronze";

}


const html=`

<div class="team-card">

<div class="team-header">

<div>

<div class="team-name">

<span class="place ${placeClass}">
${celkem!==null ? (index+1)+". " : ""}
</span>

${z.druzstvo}

</div>

<div class="team-start">

Startovní číslo: ${z.start||"-"}

</div>

</div>

</div>


<!-- ŠTAFETA 1 -->

<div class="relay">

<div class="relay-title">

🏃 Štafeta 1

</div>

<div class="measure-row">

<div
class="measure"
onclick="ulozCas('${z.id}',1,1)">

<span class="measure-label">
Měření 1
</span>

<span class="measure-value">
${z.s1m1||"—"}
</span>

</div>


<div
class="measure"
onclick="ulozCas('${z.id}',1,2)">

<span class="measure-label">
Měření 2
</span>

<span class="measure-value">
${z.s1m2||"—"}
</span>

</div>

</div>


<div class="relay-result">

<span class="result-label">
Výsledek štafety
</span>

<span class="result-value">

${s1!==null ? cisloNaCas(s1) : "—"}

</span>

</div>

</div>


<!-- ŠTAFETA 2 -->

<div class="relay">

<div class="relay-title">

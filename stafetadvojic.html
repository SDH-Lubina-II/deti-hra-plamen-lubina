<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Štafeta dvojic – SDH Lubina II–Větřkovice</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:
radial-gradient(circle at top right,#5b1010,transparent 35%),
linear-gradient(145deg,#090d13,#151b24);
color:white;
min-height:100vh;
}

.app{
max-width:900px;
margin:auto;
padding:20px 15px 40px;
}

.header{
text-align:center;
padding:10px 0 25px;
}

.logo{
font-size:42px;
}

h1{
font-size:23px;
line-height:1.4;
}

h1 span{
color:#ef3333;
}

.subtitle{
color:#8995a6;
}

.back{
background:transparent;
border:1px solid #394455;
color:#fff;
padding:10px 15px;
border-radius:10px;
margin-bottom:15px;
}

.card{
background:rgba(255,255,255,.055);
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
padding:18px;
margin-bottom:15px;
}

h2{
margin-top:0;
}

.form{
display:grid;
grid-template-columns:1.5fr 1fr auto;
gap:10px;
}

input,select{
width:100%;
padding:13px;
border-radius:11px;
border:1px solid #394455;
background:#101722;
color:white;
font-size:16px;
}

button{
cursor:pointer;
}

.primary{
background:#d72f2f;
color:white;
border:0;
border-radius:11px;
padding:13px 18px;
font-weight:bold;
}

.category{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:15px;
}

.category button{
background:#101722;
border:1px solid #394455;
color:#bfc8d5;
border-radius:11px;
padding:14px;
font-weight:bold;
}

.category button.active{
background:#b92828;
color:white;
border-color:#ef3333;
}

.team{
background:rgba(0,0,0,.18);
border:1px solid rgba(255,255,255,.1);
border-radius:17px;
padding:16px;
margin-bottom:14px;
}

.team-name{
font-size:21px;
font-weight:bold;
margin-bottom:4px;
}

.start{
font-size:12px;
color:#8995a6;
}

.relay{
background:#101722;
border-radius:14px;
padding:14px;
margin-top:12px;
}

.relay-title{
font-size:17px;
font-weight:bold;
margin-bottom:12px;
}

.measure{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.measure-box{
background:#151d29;
border:1px solid #354052;
border-radius:10px;
padding:10px;
}

.measure-title{
color:#8995a6;
font-size:12px;
margin-bottom:6px;
}

.time{
text-align:center;
font-size:18px;
}

.small-button{
width:100%;
margin-top:8px;
padding:9px;
border-radius:9px;
border:1px solid #394455;
background:#252e3c;
color:white;
}

.penalty{
color:#ffb4b4;
font-size:12px;
margin-top:6px;
}

.result{
display:flex;
justify-content:space-between;
margin-top:12px;
padding-top:12px;
border-top:1px solid #303947;
}

.result strong{
color:#ffd166;
font-size:20px;
}

.total{
background:#252e3c;
border-radius:12px;
padding:14px;
margin-top:12px;
display:flex;
justify-content:space-between;
font-weight:bold;
}

.total strong{
color:#ffd166;
font-size:22px;
}

.actions{
text-align:right;
margin-top:12px;
}

.actions button{
background:#252e3c;
border:0;
color:white;
padding:7px 10px;
border-radius:7px;
margin-left:4px;
}

.empty{
text-align:center;
color:#718096;
padding:25px;
}

.error{
color:#ff6b6b;
margin-top:10px;
font-size:13px;
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
z-index:20;
padding:15px;
overflow:auto;
}

.modal-box{
max-width:600px;
margin:20px auto;
background:#151b24;
border:1px solid #394455;
border-radius:20px;
padding:18px;
}

.trest{
display:flex;
gap:10px;
padding:10px 0;
border-bottom:1px solid #29313d;
}

.trest input{
width:20px;
height:20px;
}

.modal-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:15px;
}

.modal-buttons button{
padding:12px;
border-radius:10px;
border:0;
}

.save{
background:#d72f2f;
color:white;
}

.cancel{
background:#252e3c;
color:white;
}

@media(max-width:650px){

.form{
grid-template-columns:1fr;
}

.measure{
grid-template-columns:1fr 1fr;
}

}

</style>
</head>

<body>

<div class="app">

<button
class="back"
onclick="location.href='index.html'">
← Zpět
</button>

<div class="header">

<div class="logo">🏃‍♂️</div>

<h1>
<span>SBOR DOBROVOLNÝCH HASIČŮ</span><br>
LUBINA II–VĚTŘKOVICE
</h1>

<div class="subtitle">
okres Nový Jičín · Štafeta dvojic
</div>

</div>


<!-- PŘIDÁNÍ -->

<div class="card">

<h2>➕ Přidat družstvo</h2>

<div class="form">

<input
id="druzstvo"
placeholder="Název družstva">

<select id="kategorie">

<option value="mladsi">
👦 Mladší
</option>

<option value="starsi">
🧑 Starší
</option>

</select>

<button
class="primary"
onclick="pridatDruzstvo()">
+ Přidat
</button>

</div>

<div id="chyba"></div>

</div>


<!-- IMPORT -->

<div class="card">

<h2>📥 Import z Excelu</h2>

<p>
Excel musí obsahovat:
<b>Družstvo</b> a <b>Kategorie</b>.
</p>

<p>
Příklad jednoho řádku:
<b>Lubina A | Mladší</b>
</p>

<input
type="file"
id="excel"
accept=".xlsx,.xls">

<br><br>

<button
class="primary"
onclick="importExcel()">
📥 Načíst Excel
</button>

</div>


<!-- VÝSLEDKY -->

<div class="card">

<h2>🏆 Výsledky</h2>

<div class="category">

<button
id="mladsiBtn"
class="active"
onclick="zmenKategorie('mladsi')">
👦 Mladší
</button>

<button
id="starsiBtn"
onclick="zmenKategorie('starsi')">
🧑 Starší
</button>

</div>

<div id="vysledky"></div>

</div>

</div>


<!-- TRESTY -->

<div
id="modal"
class="modal">

<div class="modal-box">

<h2>⚠️ Tresty</h2>

<p id="modalInfo"></p>

<div id="tresty"></div>

<div class="modal-buttons">

<button
class="cancel"
onclick="zavritModal()">
Zrušit
</button>

<button
class="save"
onclick="ulozitTresty()">
Uložit
</button>

</div>

</div>

</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
onSnapshot,
updateDoc,
deleteDoc,
doc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig={

apiKey:
"AIzaSyDHGLymt1Ram6s0LJSeQLmf-hZJvCM-9jo",

authDomain:
"deti-hra-plamen-lubina.firebaseapp.com",

projectId:
"deti-hra-plamen-lubina",

storageBucket:
"deti-hra-plamen-lubina.firebasestorage.app",

messagingSenderId:
"511766112817",

appId:
"1:511766112817:web:3e9a11e9c10f234c7ac310"

};


const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

const col=
collection(db,"stafety_dvojic");


let data=[];

let kategorie="mladsi";


/* TRESTY */

const tresty=[

"Předčasné vyběhnutí",

"Nesvinutí rozpadlého kotouče",

"Nerozložená hadice na nebo za čarou",

"Nesprávné napojení hadice na proudnici či nástavec",

"Nesprávně rozvinutá hadice",

"Neoběhnutí nebo nesprávné oběhnutí mety",

"Neúplné svinutí hadice",

"Hození hadice nebo proudnice",

"Chození po nesprávné straně",

"Nesprávné svinutí hadice",

"Nesprávné odpojení proudnice nebo hadice",

"Pomoc při svinování hadice"

];


/* MODAL */

let modalId=null;

let modalRelay=null;

let modalMeasure=null;


/* =====================
   ČAS
===================== */

function cas(v){

v=String(v||"").trim();

if(!v)
return "";

v=v.replace(":"," ");

let p=v.split(/\s+/);

if(p.length===2){

let s=parseInt(p[0]);

let st=parseInt(p[1]);

if(
!isNaN(s)&&
!isNaN(st)&&
s>=0&&
st>=0&&
st<=99
){

return s+":"+String(st).padStart(2,"0");

}

}

if(/^\d{3,4}$/.test(v)){

let st=parseInt(v.slice(-2));

let s=parseInt(v.slice(0,-2));

if(st<=99)
return s+":"+String(st).padStart(2,"0");

}

return null;

}


function cislo(c){

let p=c.split(":");

return Number(p[0])*100+
Number(p[1]);

}


function casText(c){

if(c===null)
return "—";

let s=Math.floor(c/100);

let st=c%100;

return s+":"+String(st).padStart(2,"0");

}


/* =====================
   VÝPOČET
===================== */

function vysledekMereni(
z,
relay,
measure
){

let c=
z["s"+relay+"m"+measure];

if(!c)
return null;

let n=cas(c);

if(!n)
return null;

let trest=
Number(
z["s"+relay+"t"+measure]
)||0;

return cislo(n)+(trest*1000);

}


function vysledekStafety(
z,
relay
){

let a=
vysledekMereni(z,relay,1);

let b=
vysledekMereni(z,relay,2);

if(a===null&&b===null)
return null;

if(a===null)
return b;

if(b===null)
return a;

/* horší měření */

return Math.max(a,b);

}


function celkem(z){

let a=
vysledekStafety(z,1);

let b=
vysledekStafety(z,2);

if(a===null&&b===null)
return null;

if(a===null)
return b;

if(b===null)
return a;

/* lepší štafeta */

return Math.min(a,b);

}


/* =====================
   FIREBASE
===================== */

onSnapshot(
col,
snap=>{

data=[];

snap.forEach(d=>{

data.push({
id:d.id,
...d.data()
});

});

render();

},
error=>{

console.error(error);

zobrazChybu(
"Firebase chyba: "+error.message
);

}
);


/* =====================
   PŘIDAT
===================== */

window.pridatDruzstvo=
async function(){

let input=
document.getElementById("druzstvo");

let nazev=
input.value.trim();

let kat=
document.getElementById("kategorie").value;


if(!nazev){

zobrazChybu(
"Zadej název družstva."
);

return;

}


try{

let start=0;

data.forEach(z=>{

start=
Math.max(
start,
Number(z.start)||0
);

});


await addDoc(
col,
{

druzstvo:nazev,

kategorie:kat,

start:start+1,

s1m1:"",
s1m2:"",
s1t1:0,
s1t2:0,

s2m1:"",
s2m2:"",
s2t1:0,
s2t2:0,

s1np1:false,
s1np2:false,
s2np1:false,
s2np2:false,

vytvoreno:
serverTimestamp()

}
);


input.value="";

zobrazChybu(
"✓ Družstvo bylo přidáno."
);

}
catch(error){

console.error(error);

zobrazChybu(
"CHYBA FIREBASE: "+error.message
);

}

};


/* =====================
   KATEGORIE
===================== */

window.zmenKategorie=
function(k){

kategorie=k;

document
.getElementById("mladsiBtn")
.classList
.toggle("active",k==="mladsi");

document
.getElementById("starsiBtn")
.classList
.toggle("active",k==="starsi");

render();

};


/* =====================
   RENDER
===================== */

function render(){

let box=
document.getElementById("vysledky");

let seznam=
data.filter(
z=>z.kategorie===kategorie
);


seznam.sort((a,b)=>{

let aa=celkem(a);

let bb=celkem(b);

if(aa===null&&bb===null)
return a.start-b.start;

if(aa===null)
return 1;

if(bb===null)
return -1;

return aa-bb;

});


box.innerHTML="";


if(!seznam.length){

box.innerHTML=
`<div class="empty">
Zatím není žádné družstvo.
</div>`;

return;

}


seznam.forEach((z,i)=>{

let vys=celkem(z);

let poradi=
vys!==null
?
(i+1)+". "
:
"";

box.innerHTML+=`

<div class="team">

<div class="team-name">
${poradi}${z.druzstvo}
</div>

<div class="start">
Start: ${z.start}
</div>

${relayHTML(z,1)}

${relayHTML(z,2)}

<div class="total">

<span>
Celkový výsledek
</span>

<strong>
${vys!==null?casText(vys):"—"}
</strong>

</div>

<div class="actions">

<button
onclick="posun('${z.id}',-1)">
⬆️
</button>

<button
onclick="posun('${z.id}',1)">
⬇️
</button>

<button
onclick="edit('${z.id}')">
✏️
</button>

<button
onclick="smazat('${z.id}')">
🗑️
</button>

</div>

</div>

`;

});

}


/* =====================
   ŠTAFETA HTML
===================== */

function relayHTML(z,r){

let a=
vysledekMereni(z,r,1);

let b=
vysledekMereni(z,r,2);

let ta=
Number(z["s"+r+"t1"])||0;

let tb=
Number(z["s"+r+"t2"])||0;

let vys=
vysledekStafety(z,r);


return `

<div class="relay">

<div class="relay-title">
🏃 Štafeta ${r}
</div>

<div class="measure">

<div class="measure-box">

<div class="measure-title">
Měření 1
</div>

<input
class="time"
value="${z["s"+r+"m1"]||""}"
placeholder="15 55"
inputmode="numeric"
onchange="ulozCas(
this,
'${z.id}',
${r},
1
)">

<button
class="small-button"
onclick="trestyModal(
'${z.id}',
${r},
1
)">
⚠️ Tresty: ${ta}
</button>

<div class="penalty">
${ta?"+ "+(ta*10)+" s":"Bez trestu"}
</div>

</div>


<div class="measure-box">

<div class="measure-title">
Měření 2
</div>

<input
class="time"
value="${z["s"+r+"m2"]||""}"
placeholder="15 55"
inputmode="numeric"
onchange="ulozCas(
this,
'${z.id}',
${r},
2
)">

<button
class="small-button"
onclick="trestyModal(
'${z.id}',
${r},
2
)">
⚠️ Tresty: ${tb}
</button>

<div class="penalty">
${tb?"+ "+(tb*10)+" s":"Bez trestu"}
</div>

</div>

</div>

<div class="result">

<span>
Výsledek štafety
</span>

<strong>
${vys!==null?casText(vys):"—"}
</strong>

</div>

</div>

`;

}


/* =====================
   ČAS
===================== */

window.ulozCas=
async function(input,id,r,m){

let hodnota=
cas(input.value);

if(
input.value.trim()!==""&&
hodnota===null
){

alert(
"Špatný čas.\n\nPoužij například 15 55."
);

input.value="";

return;

}


try{

await updateDoc(
doc(db,"stafety_dvojic",id),
{

["s"+r+"m"+m]:
hodnota

}
);

}
catch(error){

alert(
"Chyba při ukládání času:\n"+
error.message
);

}

};


/* =====================
   TRESTY MODAL
===================== */

window.trestyModal=
function(id,r,m){

let z=
data.find(x=>x.id===id);

if(!z)
return;

modalId=id;
modalRelay=r;
modalMeasure=m;

document.getElementById("modalInfo").textContent=
z.druzstvo+
" · Štafeta "+
r+
" · Měření "+
m;


let ulozene=
z["s"+r+"t"+m+"Items"]||[];

let html="";

tresty.forEach((t,i)=>{

html+=`

<label class="trest">

<input
type="checkbox"
class="trestCheck"
data-i="${i}"
${ulozene.includes(i)?"checked":""}>

<span>
${t}
</span>

</label>

`;

});


html+=`

<label class="trest">

<input
type="checkbox"
id="npCheck"
${z["s"+r+"np"+m]?"checked":""}>

<strong>
NP – neplatný pokus
</strong>

</label>

`;


document.getElementById("tresty").innerHTML=html;

document.getElementById("modal").style.display="block";

};


window.zavritModal=
function(){

document.getElementById("modal").style.display="none";

modalId=null;

};


/* =====================
   ULOŽIT TRESTY
===================== */

window.ulozitTresty=
async function(){

let checked=
[
...document.querySelectorAll(".trestCheck:checked")
]
.map(x=>Number(x.dataset.i));


let np=
document.getElementById("npCheck").checked;


try{

let fields={};

fields[
"s"+modalRelay+
"t"+modalMeasure
]=checked.length;

fields[
"s"+modalRelay+
"t"+modalMeasure+
"Items"
]=checked;

fields[
"s"+modalRelay+
"np"+modalMeasure
]=np;


await updateDoc(
doc(db,"stafety_dvojic",modalId),
fields
);


zavritModal();

}
catch(error){

alert(
"Chyba při ukládání trestů:\n"+
error.message
);

}

};


/* =====================
   EDIT
===================== */

window.edit=
async function(id){

let z=
data.find(x=>x.id===id);

let n=
prompt(
"Družstvo:",
z.druzstvo
);

if(!n)
return;

await updateDoc(
doc(db,"stafety_dvojic",id),
{
druzstvo:n.trim()
}
);

};


/* =====================
   SMAZAT
===================== */

window.smazat=
async function(id){

if(!confirm(
"Opravdu chceš smazat družstvo?"
))
return;

await deleteDoc(
doc(db,"stafety_dvojic",id)
);

};


/* =====================
   POSUN
===================== */

window.posun=
async function(id,smer){

let seznam=
[...data].sort(
(a,b)=>a.start-b.start
);

let i=
seznam.findIndex(
x=>x.id===id
);

let j=i+smer;

if(j<0||j>=seznam.length)
return;

let a=seznam[i];

let b=seznam[j];

await updateDoc(
doc(db,"stafety_dvojic",a.id),
{
start:b.start
}
);

await updateDoc(
doc(db,"stafety_dvojic",b.id),
{
start:a.start
}
);

};


/* =====================
   EXCEL
===================== */

window.importExcel=
async function(){

let file=
document.getElementById("excel").files[0];

if(!file){

alert(
"Vyber Excel."
);

return;

}


try{

let buffer=
await file.arrayBuffer();

let wb=
XLSX.read(
buffer,
{type:"array"}
);

let sheet=
wb.Sheets[
wb.SheetNames[0]
];

let rows=
XLSX.utils.sheet_to_json(
sheet,
{defval:""}
);


let start=
data.reduce(
(max,z)=>
Math.max(max,Number(z.start)||0),
0
);


for(let row of rows){

let nazev=
row["Družstvo"]||
row["Druzstvo"];

let kat=
String(
row["Kategorie"]||""
)
.toLowerCase()
.trim();


if(!nazev)
continue;

if(
kat==="mladší"||
kat==="mladsi"
)
kat="mladsi";

else if(
kat==="starší"||
kat==="starsi"
)
kat="starsi";

else
continue;


start++;

await addDoc(
col,
{

druzstvo:String(nazev),

kategorie:kat,

start:start,

s1m1:"",
s1m2:"",
s1t1:0,
s1t2:0,

s2m1:"",
s2m2:"",
s2t1:0,
s2t2:0

}
);

}

alert("Import dokončen.");

}
catch(error){

alert(
"Chyba při importu:\n"+
error.message
);

}

};


/* =====================
   CHYBA
===================== */

function zobrazChybu(text){

let el=
document.getElementById("chyba");

el.className="error";

el.textContent=text;

}

</script>

</body>
</html>

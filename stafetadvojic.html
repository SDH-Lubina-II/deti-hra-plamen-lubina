<script type="module">


import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
getFirestore,
collection,
addDoc,
onSnapshot,
updateDoc,
deleteDoc,
doc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig={

apiKey:
"AIzaSyDHGLymt1Ram6s0LJSeQLmf-hZJvCM-9jo",

authDomain:
"deti-hra-plamen-lubina.firebaseapp.com",

projectId:
"deti-hra-plamen-lubina",

storageBucket:
"deti-hra-plamen-lubina.firebasestorage.app",

messagingSenderId:
"511766112817",

appId:
"1:511766112817:web:3e9a11e9c10f234c7ac310"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);

const col=
collection(
db,
"stafety_dvojic"
);


let data=[];

let vybranaKategorie="mladsi";


/* TRESTY */

const tresty=[

"Předčasné vyběhnutí",

"Nesvinutí rozpadlého kotouče",

"Nerozložená hadice na nebo za čarou",

"Nesprávné napojení hadice na proudnici nebo nástavec",

"Nesprávně rozvinutá hadice",

"Neoběhnutí nebo nesprávné oběhnutí mety",

"Neúplné svinutí hadice",

"Hození hadice, koncovky nebo proudnice",

"Chození po nesprávné straně mety nebo hydrantu",

"Nesprávné svinutí hadice",

"Nesprávné odpojení proudnice nebo hadice",

"Jiné porušení pravidel – 10 s"

];


/* MODAL */

let modalId=null;

let modalRelay=null;

let modalMeasure=null;


/* =========================
   ČAS
========================= */

/*
15 55 → 15:55
*/

function normalizujCas(hodnota){

let text=
String(hodnota ?? "")
.trim();


if(text==="")
return "00:00";


text=text.replace(":"," ");

let casti=
text.split(/\s+/);


if(casti.length===2){

let sekundy=
parseInt(casti[0],10);

let setiny=
parseInt(casti[1],10);


if(
!isNaN(sekundy)&&
!isNaN(setiny)&&
sekundy>=0&&
setiny>=0&&
setiny<=99
){

return (
sekundy+
":"+
String(setiny).padStart(2,"0")
);

}

}


/* 1555 */

if(/^\d{3,4}$/.test(text)){

let setiny=
parseInt(text.slice(-2),10);

let sekundy=
parseInt(text.slice(0,-2),10);


if(
!isNaN(sekundy)&&
!isNaN(setiny)&&
setiny<=99
){

return (
sekundy+
":"+
String(setiny).padStart(2,"0")
);

}

}


return null;

}


function casNaCislo(cas){

if(!cas)
return null;

let casti=
cas.split(":");

return (
Number(casti[0])*100+
Number(casti[1])
);

}


function cisloNaCas(cislo){

if(cislo===null)
return "—";


let sekundy=
Math.floor(cislo/100);

let setiny=
cislo%100;


return (
sekundy+
":"+
String(setiny).padStart(2,"0")
);

}


/* =========================
   VÝPOČET
========================= */


/*
NP = neplatné měření.

Pokud je jedno měření NP a druhé platné,
bere se platné měření.

Pokud jsou obě NP,
štafeta je NP.
*/

function vysledekMereni(
z,
relay,
measure
){

if(
z["s"+relay+"np"+measure]
)
return null;


let cas=
z["s"+relay+"m"+measure]||"00:00";


if(cas==="00:00")
return null;


let cislo=
casNaCislo(cas);


if(cislo===null)
return null;


let pocet=
Number(
z["s"+relay+"t"+measure]
)||0;


/*
10 sekund = 1000 setin
*/

return (
cislo+
(pocet*1000)
);

}


/* ŠTAFETA */

function vysledekStafety(
z,
relay
){

/*
Štafeta 2 neběží
*/

if(
relay===2&&
z.s2bezi===false
)
return null;


let a=
vysledekMereni(z,relay,1);

let b=
vysledekMereni(z,relay,2);


if(a===null&&b===null){

/*
Pokud jsou obě měření označena NP,
vracíme speciální hodnotu.
*/

let np1=
z["s"+relay+"np1"];

let np2=
z["s"+relay+"np2"];

if(np1&&np2)
return "NP";

return null;

}


if(a===null)
return b;


if(b===null)
return a;


/*
Z dvou měření se bere HORŠÍ
*/

return Math.max(a,b);

}


/* CELKEM */

function celkovyVysledek(z){

let s1=
vysledekStafety(z,1);

let s2=
vysledekStafety(z,2);


/*
Štafeta 1 NP
a štafeta 2 platná
*/

if(s1==="NP")
return s2;


/*
Štafeta 2 NP
a štafeta 1 platná
*/

if(s2==="NP")
return s1;


if(s1===null&&s2===null)
return null;


if(s1===null)
return s2;


if(s2===null)
return s1;


/*
Z obou štafet se bere LEPŠÍ
*/

return Math.min(s1,s2);

}


/* =========================
   FIREBASE
========================= */

onSnapshot(

col,

snap=>{

data=[];

snap.forEach(
d=>{

data.push({

id:d.id,
...d.data()

});

});


/*
DŮLEŽITÉ:
Řazení je podle startovního čísla.

NE podle času.
*/

data.sort(
(a,b)=>
Number(a.start||0)-
Number(b.start||0)
);

render();

},

error=>{

console.error(error);

zobrazHlasku(
"Firebase chyba: "+
error.message,
true
);

}

);


/* =========================
   PŘIDAT
========================= */

window.pridatDruzstvo=
async function(){

const input=
document.getElementById(
"druzstvo"
);

const nazev=
input.value.trim();

const kat=
document
.getElementById(
"kategorie"
)
.value;


if(!nazev){

zobrazHlasku(
"Zadej název družstva.",
true
);

return;

}


try{

let maxStart=0;

data.forEach(z=>{

maxStart=
Math.max(
maxStart,
Number(z.start)||0
);

});


await addDoc(

col,

{

druzstvo:nazev,

kategorie:kat,

start:maxStart+1,


/* ŠTAFETA 1 */

s1bezi:true,

s1m1:"00:00",
s1m2:"00:00",

s1t1:0,
s1t2:0,

s1np1:false,
s1np2:false,

s1t1Items:[],
s1t2Items:[],


/* ŠTAFETA 2 */

s2bezi:true,

s2m1:"00:00",
s2m2:"00:00",

s2t1:0,
s2t2:0,

s2np1:false,
s2np2:false,

s2t1Items:[],
s2t2Items:[],


vytvoreno:
serverTimestamp()

}

);


input.value="";

zobrazHlasku(
"✓ Družstvo bylo přidáno.",
false
);

}

catch(error){

console.error(error);

zobrazHlasku(
"CHYBA FIREBASE: "+
error.message,
true
);

}

};


/* =========================
   KATEGORIE
========================= */

window.zmenKategorie=
function(kategorie){

vybranaKategorie=
kategorie;


document
.getElementById("mladsiBtn")
.classList
.toggle(
"active",
kategorie==="mladsi"
);


document
.getElementById("starsiBtn")
.classList
.toggle(
"active",
kategorie==="starsi"
);


render();

};


/* =========================
   RENDER
========================= */

function render(){

const box=
document.getElementById(
"vysledky"
);

box.innerHTML="";


const seznam=
data.filter(
z=>
z.kategorie===
vybranaKategorie
);


/*
POŘADÍ SE NIKDY
NEŘADÍ PODLE ČASU.
*/

seznam.sort(
(a,b)=>
Number(a.start||0)-
Number(b.start||0)
);


if(!seznam.length){

box.innerHTML=`

<div class="empty">

Zatím není žádné družstvo.

</div>

`;

return;

}


seznam.forEach(
(z,index)=>{

vykresliDruzstvo(
box,
z,
index
);

});

}


/* =========================
   DRUŽSTVO
========================= */

function vykresliDruzstvo(
box,
z,
index
){

const vys=
celkovyVysledek(z);


let vysledekHTML=
"—";


if(vys==="NP"){

vysledekHTML=
`<strong class="total-np">NP</strong>`;

}

else if(vys!==null){

vysledekHTML=
`<strong>
${cisloNaCas(vys)}
</strong>`;

}


box.innerHTML+=`

<div class="team">


<div class="team-header">

<div>

<div class="team-name">

${index+1}. ${z.druzstvo}

</div>

<div class="start">

Startovní číslo: ${z.start}

</div>

</div>

</div>


<div class="relays">


${vytvorStafety(
z,
1
)}


${vytvorStafety(
z,
2
)}


</div>


<div class="total">

<span>
Celkový výsledek
</span>

${vysledekHTML}

</div>


<div class="actions">

<button
onclick="posunNahoru('${z.id}')">
⬆️
</button>

<button
onclick="posunDolu('${z.id}')">
⬇️
</button>

<button
onclick="editDruzstvo('${z.id}')">
✏️
</button>

<button
onclick="smazDruzstvo('${z.id}')">
🗑️
</button>

</div>


</div>

`;

}


/* =========================
   ŠTAFETA
========================= */

function vytvorStafety(
z,
relay
){

/*
ŠTAFETA 2 NEBĚŽÍ
*/

if(
relay===2&&
z.s2bezi===false
){

return `

<div class="relay">

<div class="relay-title">

🏃 Štafeta 2

</div>

<div class="relay-status">

<button
class="status-button off"
onclick="nastavBezi('${z.id}',true)">

☐ Neběží

</button>

</div>

<div class="not-running">

Štafeta nebude startovat.

/* =========================
   PŘÍPRAVA ČASU
========================= */

window.pripravaCas=
function(input){

/*
Když je 00:00,
při kliknutí se označí celý text.
*/

if(
input.value==="00:00"
){

input.select();

}

};


/* =========================
   ULOŽIT ČAS
========================= */

window.ulozCas=
async function(
input,
id,
relay,
measure
){

let hodnota=
input.value.trim();


/*
Pokud uživatel nic nezmění,
zůstane 00:00.
*/

if(hodnota===""){

hodnota="00:00";

}


let cas=
normalizujCas(hodnota);


if(cas===null){

alert(
"Špatný čas.\n\n"+
"Zadej například:\n15 55"
);

input.value="00:00";

return;

}


input.value=cas;


try{

await updateDoc(

doc(
db,
"stafety_dvojic",
id
),

{

["s"+relay+"m"+measure]:
cas

}

);

}

catch(error){

alert(
"Chyba při ukládání času:\n"+
error.message
);

}

};

/* =========================

========================= */

window.otevritTresty=
function(
id,
relay,
measure
){

const z=
data.find(
x=>x.id===id
);

if(!z)
return;


modalId=id;

modalRelay=relay;

modalMeasure=measure;


document
.getElementById("modalInfo")
.textContent=
z.druzstvo+
" · Štafeta "+
relay+
" · Měření "+
measure;


const ulozene=
z[
"s"+
relay+
"t"+
measure+
"Items"
]||[];


let html="";


tresty.forEach(
(t,index)=>{

html+=`

<label class="trest">

<input

type="checkbox"

class="trestCheck"

data-index="${index}"

${
ulozene.includes(index)
?
"checked"
:
""
}

>

<span>

${t}

</span>

</label>

`;

});


document
.getElementById("tresty")
.innerHTML=html;


document
.getElementById("npCheck")
.checked=
z[
"s"+
relay+
"np"+
measure
]||false;


document
.getElementById("modal")
.style.display="block";

};

   ULOŽIT TRESTY
========================= */

window.ulozitTresty=
async function(){

if(!modalId)
return;


const vybrane=
[
...
document.querySelectorAll(
".trestCheck:checked"
)
]
.map(
x=>
Number(x.dataset.index)
);


const np=
document
.getElementById("npCheck")
.checked;


const fields={};


fields[
"s"+
modalRelay+
"t"+
modalMeasure
]=
vybrane.length;


fields[
"s"+
modalRelay+
"t"+
modalMeasure+
"Items"
]=
vybrane;


fields[
"s"+
modalRelay+
"np"+
modalMeasure
]=
np;


try{

await updateDoc(

doc(
db,
"stafety_dvojic",
modalId
),

fields

);


zavritModal();

}

catch(error){

alert(
"Chyba při ukládání trestů:\n"+
error.message
);

}

};

window.posunNahoru=
async function(id){

const seznam=
[...data]
.sort(
(a,b)=>
Number(a.start||0)-
Number(b.start||0)
);


const index=
seznam.findIndex(
x=>x.id===id
);


if(index<=0)
return;


const pred=
seznam[index-1];

const aktualni=
seznam[index];


await updateDoc(

doc(
db,
"stafety_dvojic",
aktualni.id
),

{
start:pred.start
}

);


await updateDoc(

doc(
db,
"stafety_dvojic",
pred.id
),

{
start:aktualni.start
}

);

};


/* =========================
   POSUN DOLŮ
========================= */

window.posunDolu=
async function(id){

const seznam=
[...data]
.sort(
(a,b)=>
Number(a.start||0)-
Number(b.start||0)
);


const index=
seznam.findIndex(
x=>x.id===id
);


if(
index<0||
index>=seznam.length-1
)
return;


const dalsi=
seznam[index+1];

const aktualni=
seznam[index];


await updateDoc(

doc(
db,
"stafety_dvojic",
aktualni.id
),

{
start:dalsi.start
}

);


await updateDoc(

doc(
db,
"stafety_dvojic",
dalsi.id
),

{
start:aktualni.start
}

);

};

window.importExcel=
async function(){

const input=
document.getElementById(
"excel"
);

if(
!input.files||
!input.files.length
){

alert(
"Vyber Excel soubor."
);

return;

}


try{

const file=
input.files[0];

const buffer=
await file.arrayBuffer();

const workbook=
XLSX.read(
buffer,
{
type:"array"
}
);

const sheet=
workbook.Sheets[
workbook.SheetNames[0]
];

const rows=
XLSX.utils.sheet_to_json(
sheet,
{
defval:""
}
);


let maxStart=
data.reduce(
(max,z)=>
Math.max(
max,
Number(z.start)||0
),
0
);


for(
const row of rows
){

let nazev=
row["Družstvo"]||
row["Druzstvo"];


let kat=
String(
row["Kategorie"]||
""
)
.trim()
.toLowerCase();


if(!nazev)
continue;


if(
kat==="mladší"||
kat==="mladsi"
){

kat="mladsi";

}

else if(
kat==="starší"||
kat==="starsi"
){

kat="starsi";

}

else{

continue;

}


maxStart++;


await addDoc(

col,

{

druzstvo:
String(nazev).trim(),

kategorie:kat,

start:maxStart,

s1bezi:true,

s1m1:"00:00",
s1m2:"00:00",

s1t1:0,
s1t2:0,

s1np1:false,
s1np2:false,

s1t1Items:[],
s1t2Items:[],

s2bezi:true,

s2m1:"00:00",
s2m2:"00:00",

s2t1:0,
s2t2:0,

s2np1:false,
s2np2:false,

s2t1Items:[],
s2t2Items:[],

vytvoreno:
serverTimestamp()

}

);

}


input.value="";

zobrazHlasku(
"✓ Import dokončen.",
false
);

}

catch(error){

console.error(error);

zobrazHlasku(
"Chyba při importu: "+
error.message,
true
);

}

};


/* =========================
   HLÁŠKA
========================= */

function zobrazHlasku(
text,
chyba
){

const el=
document.getElementById(
"hlaska"
);

el.className=
chyba
?
"error"
:
"success";

el.textContent=text;


setTimeout(
()=>{

el.textContent="";

},
4000
);

}
